# Checks every push and pull request: frontend types, lint and tests, the
# Rust side's formatting, Clippy and tests, and the Swift package's tests.
# Rust and Swift both run the shared cases in fixtures/task-format/.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # runs the .test.ts files directly (type stripping)
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run format:check
      - run: npm run lint
      - run: npm test

  rust:
    # macOS: the app uses macOS-only crates (tauri-nspanel), and it's the only target.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri checks at compile time that the frontend folder exists; it may be empty here.
      - run: mkdir -p ../dist
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  swift:
    # NowboardKit, the Swift package behind the SwiftUI app (docs/adr/0006).
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apple/NowboardKit
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      # The app's own tests (every board action against a temporary folder),
      # on macOS. The Xcode project is generated from apple/project.yml.
      - run: brew install xcodegen
      - run: xcodegen
        working-directory: apple
      - run: xcodebuild test -project Nowboard.xcodeproj -scheme Nowboard -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
        working-directory: apple
