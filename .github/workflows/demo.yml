# Builds the browser demo (the board with sample data, no Rust) and publishes
# it to GitHub Pages: https://nestoririondo.github.io/nowboard/
# Runs on every push to main, or by hand from the Actions tab.
name: Web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, like GitHub's official Pages template. Keeping them apart means
  # the artifact is fully registered before deploy looks for it, and
  # "Re-run failed jobs" re-runs only deploy instead of uploading a second
  # "github-pages" artifact into the same run (which makes deploy fail).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The site lives under /nowboard/, so assets need that prefix.
      - run: npm run build -- --base=/nowboard/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
