# The Xcode project, as text. XcodeGen turns this into Nowboard.xcodeproj:
#
#   cd apple && xcodegen
#
# The .xcodeproj is generated, so it isn't in git (see .gitignore). Change
# this file instead, and run `xcodegen` again. Docs: https://github.com/yonaskolb/XcodeGen

name: Nowboard
options:
  bundleIdPrefix: com.nestoririondo
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  # The task file format, shared by both platforms (local package, same repo).
  NowboardKit:
    path: NowboardKit

targets:
  Nowboard:
    type: application
    # One target for both platforms: the same SwiftUI code builds an iPhone
    # app and a Mac app. Platform-only code sits behind `#if os(...)`.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Nowboard
    dependencies:
      - package: NowboardKit
    entitlements:
      path: Nowboard/Nowboard.entitlements
      properties:
        # macOS: no App Sandbox, like the Tauri app (ADR 0009). With the
        # sandbox, every rebuild (signed ad hoc, no developer account) loses
        # access to the picked folder. iOS ignores this key: it always sandboxes.
        com.apple.security.app-sandbox: false
    settings:
      base:
        # Not the Tauri app's id (com.nestoririondo.nowboard), so both apps
        # can be installed side by side until the Tauri one is archived.
        PRODUCT_BUNDLE_IDENTIFIER: com.nestoririondo.nowboard.swiftui
        PRODUCT_NAME: Nowboard
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nowboard
        # Nowboard/Assets.xcassets, drawn by scripts/app-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Nowboard/Assets.xcassets, drawn by scripts/app-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        TARGETED_DEVICE_FAMILY: "1,2"
        # No paid developer account yet: sign locally (simulator and this Mac).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_PREVIEWS: YES

  # Tests for the app's store: every action against a temporary folder.
  # `xcodebuild test -scheme Nowboard -destination 'platform=macOS'`
  NowboardTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: NowboardTests
    dependencies:
      - target: Nowboard
      - package: NowboardKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        # The app the tests run inside. A Mac app keeps its program in
        # Contents/MacOS, an iPhone app at the top, so each platform gets its own path.
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Nowboard.app/Contents/MacOS/Nowboard
        "TEST_HOST[sdk=iphone*]": $(BUILT_PRODUCTS_DIR)/Nowboard.app/Nowboard
        BUNDLE_LOADER: $(TEST_HOST)

  # Touch tests on the iPhone simulator (drag and drop needs real touches).
  # `xcodebuild test -scheme NowboardUITests -destination 'platform=iOS Simulator,name=iPhone 16 Pro'`
  NowboardUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: NowboardUITests
    dependencies:
      - target: Nowboard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: Nowboard

schemes:
  NowboardUITests:
    build:
      targets:
        Nowboard: all
        NowboardUITests: [test]
    test:
      targets:
        - NowboardUITests
  Nowboard:
    build:
      targets:
        Nowboard: all
        NowboardTests: [test]
    test:
      targets:
        - NowboardTests
