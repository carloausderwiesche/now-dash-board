# The Xcode project, as text. XcodeGen turns this into Nowboard.xcodeproj:
#
#   cd apple && xcodegen
#
# The .xcodeproj is generated, so it isn't in git (see .gitignore). Change
# this file instead, and run `xcodegen` again. Docs: https://github.com/yonaskolb/XcodeGen

name: Nowboard
options:
  bundleIdPrefix: com.nestoririondo
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  # The task file format, shared by both platforms (local package, same repo).
  NowboardKit:
    path: NowboardKit
  # Shows task notes as Markdown in the card panel (ADR 0014).
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"

targets:
  Nowboard:
    type: application
    # One target for both platforms: the same SwiftUI code builds an iPhone
    # app and a Mac app. Platform-only code sits behind `#if os(...)`.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Nowboard
      - path: Shared
      # The words the app and the site-blocking helper share (Mac only in use).
      - path: HelperShared
      # The helper's launchd description goes to Contents/Library/LaunchDaemons (Mac only).
      - path: Helper/com.nestoririondo.nowboard.swiftui.helper.plist
        destinationFilters: [macOS]
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: NowboardKit
      - package: MarkdownUI
      # The Lock Screen banner (ADR 0013). iPhone only.
      - target: NowboardWidgets
        destinationFilters: [iOS]
      # The site-blocking helper program, copied into Contents/MacOS (ADR 0019). Mac only.
      - target: NowboardHelper
        destinationFilters: [macOS]
        embed: true
        codeSign: true
        copy:
          destination: executables
    entitlements:
      path: Nowboard/Nowboard.entitlements
      properties:
        # macOS: no App Sandbox, like the Tauri app (ADR 0009). With the
        # sandbox, every rebuild (signed ad hoc, no developer account) loses
        # access to the picked folder. iOS ignores this key: it always sandboxes.
        com.apple.security.app-sandbox: false
    settings:
      base:
        # Not the Tauri app's id (com.nestoririondo.nowboard), so both apps
        # can be installed side by side until the Tauri one is archived.
        PRODUCT_BUNDLE_IDENTIFIER: com.nestoririondo.nowboard.swiftui
        PRODUCT_NAME: Nowboard
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nowboard
        # Nowboard/Assets.xcassets, drawn by scripts/app-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        TARGETED_DEVICE_FAMILY: "1,2"
        # No paid developer account: the Mac and the simulator sign locally ("-");
        # a real iPhone needs a development certificate, from the free Personal
        # Team of the Apple ID added in Xcode → Settings → Accounts.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
        # Néstor Iriondo (Personal Team). Not a secret: it's in every app it signs.
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": PG7J2YC6L3
        ENABLE_PREVIEWS: YES

  # The site-blocking helper (docs/adr/0019): a small program macOS runs as root after the
  # user approves it once. It lives inside the Mac app (Contents/MacOS) with its launchd
  # description (Contents/Library/LaunchDaemons). Mac only.
  NowboardHelper:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Helper
        excludes:
          - "*.plist"
      - path: HelperShared
    dependencies:
      - package: NowboardKit
    settings:
      base:
        PRODUCT_NAME: NowboardHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.nestoririondo.nowboard.swiftui.helper
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # An embedded Info.plist gives the program its bundle id as its code-signing identity
        # (otherwise it is "NowboardHelper-<hash>"), which launchd and the signing rules look at.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # The hardened runtime is what a notarised program uses; the helper runs as root, so it has it.
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  # The focus card on the Lock Screen and in the Dynamic Island (ADR 0013).
  # The app starts and updates the Live Activity; this extension draws it.
  NowboardWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: NowboardWidgets
      - path: Shared
    info:
      path: NowboardWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nowboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nestoririondo.nowboard.swiftui.widgets
        # Must match the app's.
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": PG7J2YC6L3

  # Tests for the app's store: every action against a temporary folder.
  # `xcodebuild test -scheme Nowboard -destination 'platform=macOS'`
  NowboardTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: NowboardTests
    dependencies:
      - target: Nowboard
      - package: NowboardKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        # The app the tests run inside. A Mac app keeps its program in
        # Contents/MacOS, an iPhone app at the top, so each platform gets its own path.
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Nowboard.app/Contents/MacOS/Nowboard
        "TEST_HOST[sdk=iphone*]": $(BUILT_PRODUCTS_DIR)/Nowboard.app/Nowboard
        BUNDLE_LOADER: $(TEST_HOST)

  # Touch tests on the iPhone simulator (drag and drop needs real touches).
  # `xcodebuild test -scheme NowboardUITests -destination 'platform=iOS Simulator,name=iPhone 16 Pro'`
  NowboardUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: NowboardUITests
    dependencies:
      - target: Nowboard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: Nowboard

schemes:
  NowboardUITests:
    build:
      targets:
        Nowboard: all
        NowboardUITests: [test]
    test:
      targets:
        - NowboardUITests
  Nowboard:
    build:
      targets:
        Nowboard: all
        NowboardTests: [test]
    test:
      targets:
        - NowboardTests
